const canvas=document.getElementById('paint-canvas');
const ctx=canvas.getContext('2d');
const STROKE='#222',STROKE_W=2.5,DECO_STROKE='#555',DECO_W=1.5,LOGIC=300;

function resizeCanvas(){
 const max=560;
 const available=Math.min(window.innerWidth-16,max);
 canvas.width=available;
 canvas.height=available;
 canvas.style.width=available+'px';
 canvas.style.height=available+'px';
 redraw();
}
function scale(){return canvas.width/LOGIC}

function applyTransform(t,sc){
 const m=t.match(/rotate\(([\d.-]+),([\d.-]+),([\d.-]+)\)/);
 if(m){
  const ang=parseFloat(m[1])*Math.PI/180,cx=parseFloat(m[2])*sc,cy=parseFloat(m[3])*sc;
  ctx.translate(cx,cy);ctx.rotate(ang);ctx.translate(-cx,-cy);
 }
}

function drawSVGPath(d,sc){
 const cmds=d.match(/[MmLlHhVvCcSsQqTtAaZz][^MmLlHhVvCcSsQqTtAaZz]*/g)||[];
 let cx=0,cy=0;
 cmds.forEach(cmd=>{
  const type=cmd[0],nums=cmd.slice(1).trim().split(/[\s,]+/).map(Number).filter(n=>!isNaN(n));
  switch(type){
   case'M':cx=nums[0];cy=nums[1];ctx.moveTo(cx*sc,cy*sc);break;
   case'L':cx=nums[0];cy=nums[1];ctx.lineTo(cx*sc,cy*sc);break;
   case'Q':ctx.quadraticCurveTo(nums[0]*sc,nums[1]*sc,nums[2]*sc,nums[3]*sc);cx=nums[2];cy=nums[3];break;
   case'C':ctx.bezierCurveTo(nums[0]*sc,nums[1]*sc,nums[2]*sc,nums[3]*sc,nums[4]*sc,nums[5]*sc);cx=nums[4];cy=nums[5];break;
   case'A':{
    const [rx,ry,rot,laf,sf,x,y]=nums;
    arcTo(ctx,cx,cy,x,y,rx,ry,laf,sf,sc);cx=x;cy=y;break;
   }
   case'Z':case'z':ctx.closePath();break;
  }
 });
}

function arcTo(ctx,x1,y1,x2,y2,rx,ry,laf,sf,sc){
 const r=rx||ry,dx=(x1-x2)/2,dy=(y1-y2)/2,mx=(x1+x2)/2,my=(y1+y2)/2;
 const d2=r*r-(dx*dx+dy*dy);
 if(d2<0||r===0){ctx.lineTo(x2*sc,y2*sc);return}
 const d=Math.sqrt(d2),sign=(laf===sf)?-1:1,len=Math.sqrt(dx*dx+dy*dy);
 const ccx=mx+sign*d*(-dy/len),ccy=my+sign*d*(dx/len);
 const ang1=Math.atan2((y1-ccy)/r,(x1-ccx)/r),ang2=Math.atan2((y2-ccy)/r,(x2-ccx)/r);
 ctx.arc(ccx*sc,ccy*sc,r*sc,ang1,ang2,sf===0);
}

function drawEl(el,fillColor,isDeco){
 const sc=scale(),A=el.a;
 ctx.save();
 if(A.transform)applyTransform(A.transform,sc);
 ctx.beginPath();
 if(el.t==='ellipse')ctx.ellipse(A.cx*sc,A.cy*sc,A.rx*sc,A.ry*sc,0,0,Math.PI*2);
 else if(el.t==='circle')ctx.arc(A.cx*sc,A.cy*sc,A.r*sc,0,Math.PI*2);
 else if(el.t==='rect'){
  const r=(A.rx||0)*sc;
  if(r>0)ctx.roundRect(A.x*sc,A.y*sc,A.width*sc,A.height*sc,r);
  else ctx.rect(A.x*sc,A.y*sc,A.width*sc,A.height*sc);
 }
 else if(el.t==='polygon'){
  const pts=A.points.split(' ').map(p=>p.split(',').map(Number));
  ctx.moveTo(pts[0][0]*sc,pts[0][1]*sc);
  pts.slice(1).forEach(p=>ctx.lineTo(p[0]*sc,p[1]*sc));ctx.closePath();
 }
 else if(el.t==='path')drawSVGPath(A.d,sc);
 else if(el.t==='line'){ctx.moveTo(A.x1*sc,A.y1*sc);ctx.lineTo(A.x2*sc,A.y2*sc)}
 if(isDeco){ctx.strokeStyle=DECO_STROKE;ctx.lineWidth=DECO_W*sc;ctx.lineCap='round';ctx.stroke()}
 else{ctx.fillStyle=fillColor;ctx.fill();ctx.strokeStyle=STROKE;ctx.lineWidth=STROKE_W*sc;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
 ctx.restore();
}

function redraw(){
 const d=DRAWINGS[currentIdx];
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);
 d.zones.forEach((el,i)=>drawEl(el,colors[currentIdx][i],false));
 (d.decos||[]).forEach(el=>drawEl(el,'none',true));
}

function isInZone(el,x,y){
 const A=el.a;let tx=x,ty=y;
 if(A.transform){
  const m=A.transform.match(/rotate\(([\d.-]+),([\d.-]+),([\d.-]+)\)/);
  if(m){
   const ang=-parseFloat(m[1])*Math.PI/180,cx=parseFloat(m[2]),cy=parseFloat(m[3]),dx=x-cx,dy=y-cy;
   tx=cx+dx*Math.cos(ang)-dy*Math.sin(ang);
   ty=cy+dx*Math.sin(ang)+dy*Math.cos(ang);
  }
 }
 if(el.t==='ellipse'){const dx=(tx-A.cx)/A.rx,dy=(ty-A.cy)/A.ry;return dx*dx+dy*dy<=1}
 if(el.t==='circle'){const dx=tx-A.cx,dy=ty-A.cy;return dx*dx+dy*dy<=A.r*A.r}
 if(el.t==='rect')return tx>=A.x&&tx<=A.x+A.width&&ty>=A.y&&ty<=A.y+A.height;
 if(el.t==='polygon')return pointInPolygon(tx,ty,A.points.split(' ').map(p=>p.split(',').map(Number)));
 if(el.t==='path')return pointInPathBBox(tx,ty,A.d);
 return false;
}
function pointInPolygon(x,y,pts){
 let inside=false;
 for(let i=0,j=pts.length-1;i<pts.length;j=i++){
  const xi=pts[i][0],yi=pts[i][1],xj=pts[j][0],yj=pts[j][1];
  if(((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))inside=!inside;
 }
 return inside;
}
function pointInPathBBox(x,y,d){
 const ns=(d.match(/-?[\d.]+/g)||[]).map(Number),xs=[],ys=[];
 for(let i=0;i<ns.length;i+=2){xs.push(ns[i]);if(ns[i+1]!==undefined)ys.push(ns[i+1])}
 if(!xs.length)return false;
 return x>=Math.min(...xs)&&x<=Math.max(...xs)&&y>=Math.min(...ys)&&y<=Math.max(...ys);
}
function hitZone(px,py){
 const d=DRAWINGS[currentIdx],sc=scale();
 for(let i=d.zones.length-1;i>=0;i--)if(isInZone(d.zones[i],px/sc,py/sc))return i;
 return -1;
}
function getPos(e){
 const r=canvas.getBoundingClientRect(),src=e.touches?e.touches[0]:e;
 return{x:src.clientX-r.left,y:src.clientY-r.top};
}
function handlePaint(e){
 e.preventDefault();
 const p=getPos(e),zi=hitZone(p.x,p.y);
 if(zi<0)return;
 colors[currentIdx][zi]=isEraser?'white':currentColor;
 redraw();
}
canvas.addEventListener('click',handlePaint);
canvas.addEventListener('touchstart',handlePaint,{passive:false});

const gallery=document.getElementById('gallery');
function buildMiniSVG(d){
 const ns='http://www.w3.org/2000/svg';
 let s=`<svg viewBox="${d.vb}" xmlns="${ns}" width="50" height="50">`;
 d.zones.forEach(el=>{
  s+=`<${el.t} fill="white" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"`;
  Object.entries(el.a).forEach(([k,v])=>s+=` ${k}="${v}"`);
  s+='/>';
 });
 return s+'</svg>';
}
DRAWINGS.forEach((d,i)=>{
 const thumb=document.createElement('div');
 thumb.className='thumb'+(i===0?' active':'');
 thumb.innerHTML=buildMiniSVG(d);
 thumb.addEventListener('click',()=>{
  document.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));
  thumb.classList.add('active');currentIdx=i;
  document.getElementById('drawing-label').textContent=d.name;
  redraw();
 });
 gallery.appendChild(thumb);
});

const palEl=document.getElementById('palette');
COLORS.forEach((c,i)=>{
 const btn=document.createElement('button');
 btn.className='cbtn'+(i===0?' sel':'');btn.style.background=c;
 if(c==='#FFFFFF')btn.style.border='3px solid #ddd';
 btn.addEventListener('click',()=>{
  isEraser=false;currentColor=c;
  document.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  document.getElementById('btn-borra').style.opacity='1';
  document.getElementById('btn-borra').querySelector('span').textContent='🩹';
 });
 palEl.appendChild(btn);
});

document.getElementById('btn-borra').addEventListener('click',()=>{
 isEraser=!isEraser;
 const b=document.getElementById('btn-borra');
 b.style.opacity=isEraser?'.5':'1';
 b.querySelector('span').textContent=isEraser?'✏️':'🩹';
 if(isEraser)document.querySelectorAll('.cbtn').forEach(x=>x.classList.remove('sel'));
});

document.getElementById('btn-limpia').addEventListener('click',()=>{
 if(!confirm('¿Borrar todos los colores?'))return;
 colors[currentIdx]=DRAWINGS[currentIdx].zones.map(()=>'white');redraw();
});

document.getElementById('btn-guarda').addEventListener('click',()=>{
 const a=document.createElement('a');
 a.download='coloreo-'+Date.now()+'.png';
 a.href=canvas.toDataURL('image/png');a.click();toast('¡Guardado! 🎉');
});

function toast(msg){
 const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),2200);
}

/* PWA: botón con ID corregido */
let deferredPrompt=null;
const instalarBtn=document.getElementById('instalar-app');

window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault();deferredPrompt=e;instalarBtn.style.display='block';
});

instalarBtn.addEventListener('click',async()=>{
 if(!deferredPrompt){
  toast('Para instalar, abre el menú del navegador y elige "Instalar aplicación".');
  return;
 }
 deferredPrompt.prompt();
 const resultado=await deferredPrompt.userChoice;
 console.log('Instalación:',resultado.outcome);
 deferredPrompt=null;instalarBtn.style.display='none';
});

window.addEventListener('appinstalled',()=>{
 instalarBtn.style.display='none';
 deferredPrompt=null;
 toast('¡Aplicación instalada! 🎉');
});

/* Service Worker: se mantiene sin modificar */
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./service-worker.js')
   .then(()=>console.log('Service Worker registrado correctamente'))
   .catch(error=>console.error('Error del Service Worker:',error));
 });
}

window.addEventListener('DOMContentLoaded',()=>{
 document.getElementById('drawing-label').textContent=DRAWINGS[0].name;
 resizeCanvas();
});
window.addEventListener('resize',resizeCanvas);
</script>
